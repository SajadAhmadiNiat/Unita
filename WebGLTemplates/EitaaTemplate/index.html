<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        :root {
            --unita-background-color: #0a0a0d;
            --unita-loading-text-color: #ffffff;
            --unita-progress-color: #26a7ff;
            --unita-progress-background-color: rgba(255, 255, 255, 0.2);
        }

        @font-face {
            font-family: 'MyCustomFont';
            src: url('./unita-loading-font.woff2') format('woff2');
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--unita-background-color);
            background-image: url('./unita-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        #unita-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: transparent;
        }

        #unity-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #unita-loading-screen {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background-color: transparent;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            transition: opacity 0.25s ease;
        }

        #unita-loading-text {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90%;
            color: var(--unita-loading-text-color);
            font-family: 'MyCustomFont', Arial, sans-serif;
            font-size: clamp(14px, 2.5vw, 22px);
            line-height: 1.8;
            text-align: center;
            direction: rtl;
        }

        #unita-progress-wrapper {
            display: block;
            width: min(72vw, 360px);
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background-color: var(--unita-progress-background-color);
        }

        #unita-progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background-color: var(--unita-progress-color);
            transition: width 0.15s ease;
        }

        #unita-fullscreen-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            min-height: 42px;
            padding: 8px 18px;
            border: 0;
            border-radius: 10px;
            color: var(--unita-loading-text-color);
            background-color: rgba(255, 255, 255, 0.14);
            font-family: 'MyCustomFont', Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
        }

        #unita-fullscreen-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <main id="unita-root">
        <div id="unity-container">
            <canvas id="unity-canvas"></canvas>
        </div>

        <section id="unita-loading-screen">
            <div id="unita-loading-text">در حال بارگذاری...</div>

            <div id="unita-progress-wrapper">
                <div id="unita-progress-bar"></div>
            </div>

            <button id="unita-fullscreen-button" type="button">
                ورود به حالت تمام‌صفحه
            </button>
        </section>
    </main>

    <script>
        const canvas = document.querySelector('#unity-canvas');
        const loadingScreen = document.querySelector('#unita-loading-screen');
        const progressBar = document.querySelector('#unita-progress-bar');
        const fullscreenButton = document.querySelector('#unita-fullscreen-button');

        const buildUrl = 'Build';
        const loaderUrl = buildUrl + '/{{{ LOADER_FILENAME }}}';

        const config = {
            dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
            frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
            codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
            streamingAssetsUrl: 'StreamingAssets',
            companyName: '{{{ COMPANY_NAME }}}',
            productName: '{{{ PRODUCT_NAME }}}',
            productVersion: '{{{ PRODUCT_VERSION }}}',
            showBanner: function(message, type) {
                console.log('[Unity]', type, message);
            }
        };

        if (fullscreenButton) {
            fullscreenButton.addEventListener('click', function() {
                const root = document.documentElement;

                if (root.requestFullscreen) {
                    root.requestFullscreen();
                } else if (root.webkitRequestFullscreen) {
                    root.webkitRequestFullscreen();
                }
            });
        }

        function hideLoadingScreen() {
            if (!loadingScreen) {
                return;
            }

            loadingScreen.style.opacity = '0';

            setTimeout(function() {
                loadingScreen.style.display = 'none';
            }, 260);
        }

        function updateProgress(value) {
            if (progressBar) {
                progressBar.style.width = Math.round(value * 100) + '%';
            }
        }

        const script = document.createElement('script');
        script.src = loaderUrl;

        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                updateProgress(progress);
            }).then(function(unityInstance) {
                window.unityInstance = unityInstance;

                if (window.Eitaa && window.Eitaa.WebApp) {
                    window.Eitaa.WebApp.ready();
                    window.Eitaa.WebApp.expand();
                }

                updateProgress(1);
                hideLoadingScreen();
            }).catch(function(message) {
                console.error(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
